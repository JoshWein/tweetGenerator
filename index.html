<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLP Sentence Generator</title>
<script src="js/jquery.js"></script>
<script src="js/bootstrap.min.js"></script>
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
	<div class="container-fluid">
		<div id="wrapper">
			<div class="row text-center">
				<div class="col-sm-12 col-md-offset-3 col-md-6">
					<h1>NLP Sentence Generator</h1>	
					<a href="Report.pdf" style="color: #495538;"><h3>View Report</h3></a>
				</div>
			</div>
			<div id="inputForm">
				<div class="row">
				<div class="col-sm-12 col-md-offset-3 col-md-6">
					<div class="form-group">
						<input class="form-control" id="topicText" placeholder="Topic" autocomplete="off" style="width: 100%">
					</div>
					</div>
				</div>
				<div class="row">
					<div class="col-sm-12 col-md-offset-3 col-md-6">
						<button type="button" class="btn btn-default" style="width: 100%" onclick="start()">Generate Tweet</button>
					</div>
				</div>
				<div class="row text-center">
					<div class="col-sm-12 col-md-offset-3 col-md-6">
						<h4>Randomness</h4>
						<input type="range" id="temperature" min="10" max="200" value="100" step="5"/>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-6 col-sm-6 col-md-offset-3 col-md-3 text-left">
						<label>Less Random</label>
					</div>
					<div class="col-xs-6 col-sm-6 col-md-3 text-right">
						<label>More Random</label>
					</div>
				</div>
				<div class="row">
					<div class="col-sm-12 col-md-offset-3 col-md-6">
						<a href="#options" id="optionsToggle" data-toggle="collapse">Advanced options</a>
						<div id="options" class="collapse">
							<div class="form-group">
								<label for="order">Language model</label>
								<select class="form-control" id="order">
									<option value="2">Bigram: each word depends on the previous word</option>
									<option value="3" selected>Trigram: each word depends on the previous two</option>
									<option value="4">4-gram: previous three words (closer to real tweets)</option>
								</select>
							</div>
							<div class="checkbox">
								<label><input type="checkbox" id="backoff" checked> Back off to shorter contexts when the model hits a dead end</label>
							</div>
							<div class="form-group">
								<label for="candidates">Candidates to generate, then pick the best</label>
								<input class="form-control" type="number" id="candidates" min="1" max="500" value="100">
							</div>
							<div class="row">
								<div class="col-xs-6 form-group">
									<label for="minWords">Min words</label>
									<input class="form-control" type="number" id="minWords" min="1" max="60" value="4">
								</div>
								<div class="col-xs-6 form-group">
									<label for="maxWords">Max words</label>
									<input class="form-control" type="number" id="maxWords" min="2" max="80" value="30">
								</div>
							</div>
							<div class="form-group">
								<label for="originality">Originality</label>
								<select class="form-control" id="originality">
									<option value="any">Allow copies of real tweets</option>
									<option value="exact">No exact copies</option>
									<option value="8" selected>No runs of 8+ words from one tweet</option>
									<option value="5">No runs of 5+ words from one tweet (strict)</option>
								</select>
							</div>
							<div class="checkbox">
								<label><input type="checkbox" id="filter" checked> Filter links and profanity</label>
							</div>
							<div class="checkbox">
								<label><input type="checkbox" id="showAlternates"> Show runner-up sentences</label>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div id="errorSection">
				<div class="row">
					<h3 id="err"></h3>
				</div>
			</div>
			<div id="statusSection" class="text-center" style="display: none">
				<div class="row">
					<h2 id="statusTitle">Status</h2>
					<h3 id="status0" style="display: none"></h3>					
					<h3 id="status1" style="display: none"></h3>
					<h3 id="status2" style="display: none"></h3>
					<h3 id="status3" style="display: none"></h3>
					<h3 id="status4" style="display: none"></h3>
					<h3 id="status5" style="display: none"></h3>
					<h3 id="status6" style="display: none"></h3>
					<h3 id="status7" style="display: none"></h3>
				</div>
			</div>
			<div id="sentenceSection" style="display: none">
				<div class="row">
				<div class="col-sm-12 col-md-offset-3 col-md-6">
					<h2 id="sentence" style="display: none"></h2>
					<ol id="alternates" style="display: none"></ol>
					<p id="stats" class="text-muted"></p>
					</div>
				</div>
				<div class="row" id="buttons">
				<div class="col-sm-12 col-md-offset-3 col-md-6">
					<button type="button" class="btn btn-default" style="width: 100%" onclick="regenerate()">Regenerate</button>
					<button type="button" class="btn btn-default" style="width: 100%" onclick="newTopic()">Choose New Topic</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="js/generator.js"></script>
	<script src="js/scripts.js"></script>
</body>
</html>
